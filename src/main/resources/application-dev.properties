# Enable dev-tools
devtools.livereload.enabled=true

# Disable the logging file
logging.file.name=

# Templates reloading during development
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.cache=false

# Static resources reloading during development
resources.static-locations=file:src/main/resources/static/
resources.cache-period=0

# Show the JPA SQL queries
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://zombie.grad-rrnav.pub:8761/eureka

# Spring-boot Admin Configuration
spring.boot.admin.client.url=http://zombie.grad-rrnav.pub/admin